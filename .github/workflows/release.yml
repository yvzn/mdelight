name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: native
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Build
        run: cargo build --release --locked

      - name: Package
        id: package
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          $version = $env:TAG -replace '^v', ''
          $zip = "target\mdelight-native-$version.zip"
          Compress-Archive -Force -DestinationPath $zip -Path target\release\mdelight-native.exe, target\release\mdelight_native.pdb
          "zip=native\$zip" >> $env:GITHUB_OUTPUT

      - name: Upload to release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload $env:TAG "${{ steps.package.outputs.zip }}" --clobber --repo $env:GITHUB_REPOSITORY
